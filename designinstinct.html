<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Instinct</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --black: #000;
        --white: #fff;
        --gray-100: #f5f5f5;
        --gray-200: #e5e5e5;
        --gray-400: #a0a0a0;
        --gray-600: #666;
        --accent: #d60000;
        --green: #2e9e6e;
        --green-soft: #eaf7f2;
      }

      html, body {
        height: 100%; font-family: 'Inter', sans-serif;
        background: var(--white); color: var(--black); overflow-x: hidden;
      }

      /* SCREENS */
      .screen { display: none; min-height: 100vh; }
      .screen.active { display: flex; }

      /* INTRO */
      #intro {
        flex-direction: column; align-items: center;
        justify-content: center; padding: 48px 24px;
        text-align: center; position: relative; overflow: hidden;
      }

      #intro::before {
        content: ''; position: absolute;
        width: 600px; height: 600px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        top: -200px; right: -200px;
        animation: slowSpin 30s linear infinite; 
      }

      #intro::after {
        content: ''; position: absolute;
        width: 400px; height: 400px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        bottom: -150px; left: -100px;
        animation: slowSpin 20s linear infinite reverse; 
      }

      @keyframe slowSpin {
        from { transform: rotate(0deg); } to { transform: rotate(360deg); }
      }

      .eyebrow {
        font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--accent);
        margin-bottom: 20px; position: relative; z-index: 1;
      }

      .intro-title{
        font-size: clamp(52px, 9vw, 100px); font-weight: 900;
        line-height: 0.92; letter-spacing: -0.04em;
        margin-bottom: 24px; position: relative; z-index: 1;
      }

      .intro-title .u { border-bottom: 4px solid var(--accent); }

      intro-sub{
        font-size: 17px; font-weight: 300; color: var(--gray-600);
        max-width: 400px; line-height: 1.65
      }

      .intro-buttons{
        display: flex; gap: 12px; flex-wrap: wrap;
        justify-content: center; position: relative; z-index: 1;
      }

      .btn-start{
        background: var(--black); color: var(--white); border: none;
        padding: 18px 44px; font-size: 14px; font-weight: 700;
        letter-spacing: 0.07em; text-transform: uppercase;
        cursor: pointer; border-radius: 2px;
        transition: background 0.15s, transform 0.15s;
      }

      .btn-start:hover {background: var(--accent); transform: translateY(-2px); }

      .btn-start.secondary {
        background: none; color: var(--black);
        border: 2px solid var(--gray-200);
      }

      .btn-start.secondary:hover {
        background:none; border-color: var(--black);
        transform: translateY(-2px);
      }

      .intro-note{
        margin-top: 20px; font-size: 12px; color: var (--gray-400);
        font-style: italic; position: relative; z-index: 1;
      }

      /* GAME SHELL */
      #game { flex-direction: column; }

      .game-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 20px 40px; border-bottom: 1px solid var (--gray-200); flex-shrink: 0;
      }

      .game-logo {font-size: 14px; font-weight: 900; letter-spacing: -0.02em; }

      .header-tag {
        font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
        text-transform: uppercase; color: var(--accent);
      }

      .header-right {display: flex; gap: 12px; align-items: center; }

      .btn-sm {
        background: none; border: 1px solid var(--gray-200);
        color: var(--gray-600); padding: 8px 16px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; cursor: pointer; border-radius: 2px;
        transition: border-color 0.15s, color 0.15s;
      }
      .btn-sm:hover {border-color: var(--black); color: var(--black);}
      .btn-sm.hint-btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn-sm:disabled { opacity: 0.3; pointer-events: none; }

      .game-body {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; padding: 32px 24px 24px;
      }

      .prompt {
        font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--gray-400); margin-bottom: 16px;
      }

      .canvas-wrap {
        position: relative; width: 100%; max-width: 780px; height: 500px;
        background: var(--gray-100); border: 1px solid var(--gray-200);
        border-radius: 4px; overflow: hidden;
      }

      .bottom-bar{
        display: flex; align-items: center; gap: 16px;
        margin-top: 16px; height: 32px;
      }

      .attempt-count{ font-size: 12px; font-weight: 500; color: var(--gray-400); }
      .progress-pips{ display: flex; gap: 6px; align-items: center; }
      .pip{
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--gray-200); transform: background 0.3s;
      }
      .pip.done {background: var(--green);}

      /* SHAPES */
      .shape {
        position: absolute; cursor: grab; user-select: none;
        transition: filter 0.15s;
      }

      .shape:hover {filter: brigtness(0.8); }
      .shape.dragging {cursor: grabbing; filter: brightness(0.6); z-index: 1000; }
      .shape svg { display: block; }
      
      @keyframes idleFloat {
        0%, 100% {translate: 0 0; } 50% {translate: 0 -5px}
      }

      .idle { animation: idleFloat ease-in-out infinite; }

      @keyframes snapIn {
        from {transform: scale(0.7); opacity: 0.4; }
        to {transform: scale(1); opacity: 1; }
      }

      .snap {animation: snapIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }

      @keyframes wrongShake {
        0%, 100% { translate: 0 0; }
        20% { translate: -7px 0;} 40% { translate: 7px 0;}
        60% {translate: -4px 0;} 80% { translate: 4px 0;}
      }

      .shake { animation: wrongShake 0.35s ease; }

      /* PROXIMITY */
      .drop-zone {
        position: absolute; border: 2px dashed transparent;
        border-radius: 4px; transition: border-color 0.2s, background 0.2s;
        pointer-events: none;
      }

      .drop-zone .zone-icon {
        position: absolute; bottom: 10px; right: 12px;
        opacity: 0; line-height: 1; color: #000;
        user-select: none; pointer-events: none; transition: opacity 0.2s;
      }

      .drop-zone.visible { border-color: var(--gray-400); }
      .drop-zone.visible .zone-icon { opacity: 0.12; }
      .drop-zone.done .zone-icon { opacity: 0.25; }
      .drop-zone.visible.highlight {border-color: var(--gray-600); background: rgba(0,0,0,0.04); }
      .drop-zone.done { border-color: var(--green) !important; background: var(--green-soft) !important; }


      /* SIMILARITY */

      .cluster-halo { 
        position: absolute; border-radius: 50%;
        pointer-events: none; transition: opacity 0.3s;
        opacity: 0;
      }

      .cluster-halo.active {opacity: 1;}

      /* CONTINUITY: segments */

      .cont-piece {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }

      .cont-piece.snapped {
        cursor: default;
        pointer-events: none;
      }

      .cont-piece svg { display: block; overflow: visible; }

      .rot-handle {
        position: absolute;
        width: 14px; height: 14px;
        border-radius: 50%;
        background: var(--white);
        border: 2px solid var(--gray-400);
        cursor: crosshair;
        z-index: 10;
      }

      .rot-handle:hover {border-color: var(--accent); }
      .cont-piece.snapped .rot-handle {display: none; }

      #cont-bg { position: absolute; top: 0; left: 0; pointer-events: none; }

      @keyframes snapFlash {
        0% { filter: brightness(2); }
        100% { filter: brightness(1); }
      }

      .snap-flash { animation: snapFlash 0.35s ease; }

      /* CLOSURE */

      .clos-piece {
        position: absolute;
        cursor: grab;
        user-select: none;
        touch-action: none;
      }

      .clos-piece.snapped {
        cursor: default;
        pointer-events: none;
      }

      .clos-piece svg { display: block; overflow: visisble; }
      #clos-bg { position: absolute; top: 0; left: 0; pointer-events: none; }

      @keyframes closReveal {
        0% {opacity: 0; transform: scale(0.92); }
        60% {opacity: 1; transform: scale(1.04); }
        100% {opacity: 0.18; transform: scale(1); }
      }
      .clos-reveal-shape {animation: closReveal 1.1s ease forwards; }

      .hint-toast {
        position: absolute; top: 12px; left: 50%;
        transform: translateX(-50%) translateY(-70px);
        background: var(--black); color: var(--white);
        font-size: 13px; font-weight: 500; line-height: 1.4;
        padding: 10px 20px; border-radius: 2px;
        white-space: nowrap; z-index: 400; pointer-events: none;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .hint-toast.show { transform: translateX(-50%) translateY(0); }

      /* REVEAL BANNER */

      .reveal-banner {
        position: absolute; bottom: 0; left: 0; right: 0;
        background: var(--black); color: var(--white);
        padding: 20px 32px;
        display: flex; align-items: center; justify-content: space-between;
        transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 300;
      }
      .reveal-banner.show {transform: translateY(0);}
      .reveal-title {font-size: 26px; font-weight: 900; letter-spacing: -0.03em; margin-bottom: 4px; }
      .reveal-title .r {color: #e05555; }
      .reveal-def { font-size: 13px; color: var(--gray-400); max-width: 340px; line-height: 1.5;}

      .btn-next {
        background: var(--accent); color: var(--white); border: none;
        padding: 12px 28px; font-size: 13px; font-weight: 700;
        letter-spacing: 0.08em; text-transform: uppercase;
        cursor: pointer; border-radius: 2px;
        transition: opacity 0.15s, transform 0.15s; white-space: nowrap;
      }

      .btn-next:hover { opacity: 0.85; transform: translateY(-1px); }

      /* SYMMETRY */
      .sym-fixed {
        position: absolute; pointer-events: none;
        border-radius: 3px;
      }

      .sym-piece {
        position: absolute; cursor: grab; border-radius: 3px;
        transition: box-shadow 0.15s;
      }

      .sym-piece.dragging { cursor: grabbing; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
      .sym-piece.snapped { cursor: default; pointer-events: none; }
      .sym-ghost {
        position: absolute; pointer-events: none; border-radius: 3px;
        border: 2px dashed rgba(0,0,0,0.18); background: transparent;
        opacity: 0; transition: opacity 0.1s;
      }

      .sym-ghost-visible {opacity: 1; }
      .sym-axis {
        position: absolute; top: 0; bottom: 0; width: 1px;
        background: repeating-linear-gradient(
          to bottom, var(--gray-400) 0 6px, transparent 6px 12px
          );
        pointer-events: none;
      }

      @keyframes symSnap {
        0% {transform: scale(1.12); }
        60% {transform: scale(0.94); }
        100% {transform: scale(1); }
      }

      .sym-snap-anim {animation: symSnap 0.28s ease forwards}

      /* INTRO MODE PICKER */
      .mode-picker {
        display: flex; gap: 16px; margin-bottom: 40px;
        position: relative; z-index: 1;
      }

      .btn-mode {
        background: none; border: 2px solid var(--gray-200);
        color: var(--black); padding: 14px 36px;
        font-size: 13px; font-weight: 700; letter-spacing: 0.07em;
        text-transform: uppercase; cursor: pointer; border-radius: 2px;
        transition: border-color 0.15s, background 0.15s, transform 0.15s;
      }

      .btn-mode:hover { border-color: var(--black); transform: translateY(-2px);}
      .btn-mode.active {
        background: var(--black); color: var(--white);
        border-color: var(--black);
      }

      .mode-panel {display: none;}
      .mode-panel.active {dispaly: flex; flex-direction: column; align-items: center; gap: 0;}
      .speedrun-start-wrap { position: relative; z-index: 1;}

      /* SPEEDRUN TIMER */
      .speedrun-timer{
        font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
        font-variant-numeric: tabular-nums; color: var(--black);
        display: none;
      }

      .speedrun-timer.visible {display: block; }

      /* SUMMARY SCREEN */
      #summary {
        flex-direction: column; align-items: center;
        justify-content: center; padding: 48px 24px;
        text-align: center; position: relative; overflow: hidden;
      }
      #summary::before {
        content: ''; position: absolute;
        width: 600px; height: 600px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        top: -200px; right: -200px; 
        animation: slowSpin 30s linear infinite;
      }
      #summary::after {
        content: ''; position: absolute;
        width: 400px; height: 400px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        bottom: -150px; left: -100px;
        animation: slowSpin 20s linear infinite reverse;
      }

      .summary-eyebrow {
        font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--accent);
        margin-bottom: 16px; position: relative; z-index: 1;
      }
      .summary-total {
        font-size: clamp(36px, 6vw, 64px); font-weight: 900;
        letter-spacing: -0.04em; line-height: 1;
        margin-bottom: 8px; position: relative; z-index: 1;
      }
      .summary-total-label {
        font-size: 13pxl font-weight: 300; color: var(--gray-600);
        margin-bottom: 40px; position: relative; z-index: 1;
      }
      .summary-table {
        width: 100%; max-width: 360px; border-collapse: collapse;
        margin-bottom: 40px; position: relative; z-index: 1;
      }
      .summary-table td {
        padding: 10px 0; border-bottom: 1px solid var(--gray-200);
        font-size: 14px; text-align: left;
      }
      .summary-table td:last-child {text-align: right; font-weight: 700; }
      .summary-table tr:last-child td { border-bottom: none; }
      .summary-actions {
        display: flex; gap: 12px; position: relative; z-index: 1;
      }

      /* CONFETTI */
      .confetti-dot {
        position: fixed; border-radius: 50%; pointer-events: none;
        animation: confettiFall linear forwards;
      }

      @keyframes confettiFall {
        0% {opacity: 1; transform: translateY(0) rotate(0deg); }
        100% {opacity: 0; transform: translateY(280px) rotate(600deg); }
      }

      </style>
  </head>

  
  <body>


  <!-- INTRO -->
    <section id= "intro" class="screen active">
      <p class="eyebrow"> Design Instinct</p>
      <h1 class="intro-title">Trust<br><span class="u">Your Eye</span></h1>
      <p class="intro-sub">No instructions. Just shapes.<br>Figure out what belongs together.</p>

      <div class="mode-picker">
        <button class="btn-mode active" id="btn-mode-levels" onclick="switchMode('levels')">Level Selection</button>
        <button class="btn-mode" id="btn-mode-speedrun" onclick="switchMode('speedrun')">Speedrun</button>
      </div>

      <!-- Level selection panel -->
      <div class="mode-panel active" id="panel-levels">
        <div class="intro-buttons">
          <button class="btn-start secondary" onclick="startLevel('proximity')">Level 1: Proximity</button>
          <button class="btn-start secondary" onclick="startLevel('similarity')">Level 2: Similarity</button>
          <button class="btn-start secondary" onclick="startLevel('continuity')">Level 3: Continuity</button>
          <button class="btn-start secondary" onclick="startLevel('closure')">Level 4: Closure</button>
          <button class="btn-start secondary" onclick="startLevel('figureground')">Level 5: Figure/Ground</button>
          <button class="btn-start secondary" onclick="startLevel('symmetry')">Level 6: Symmetry</button>
        </div>
      </div>

      <!-- Speedrun panel -->
      <div class="mode-panel" id="panel-speedrun">
        <p class="intro-sub" style="margin-bottom: 28px; margin-top: -16px;"> All 6 levels, no hints, no stopping.</p>
        <div class="speedrun-start-wrap">
          <button class="btn-start" onclick="startSpeedrun()">Start Run</button>
        </div>
      </div>

      <p class="intro-note">drag · group · discover </p>
    </section>

<!-- SUMMARY -->
    <section id="summary" class="screen">
      <p class="summary-eyebrow">Speedrun Complete</p>
      <div class="summary-total" id="summary-total">-</div>
      <div class="summary-total-label">total time</div>
      <table class="summary-table" id="summary-table"></table>
      <div class="summary-actions">
        <button class="btn-start" onclick="startSpeedrun()">Run Again</button>
        <button class="btn-start secondary" onclick="goToIntro()">← Levels</button>
      </div>
    </section>

    <!-- GAME -->
    <div id="game" class="screen">
      <header class="game-header">
        <span class="game-logo">Desin Instinct</span>
        <span class="header-tag" id="header-tag">-</span>
        <div class="header-right">
          <button class="btn-sm hint-btn" id="btn-hint" onclick="triggerHint()">Hint</button>
          <span class="speedrun-timer" id="speedrun-timer">0:00</span>
          <button class = "btn-sm" onclick="resetGame()">Reset</button>
          <button class = "btn-sm" onclick="goToIntro()">← Levels</button>
        </div>
      </header>
      <div class="game-body">
        <p class="prompt" id="prompt-text">-</p>
        <div class="canvas-wrap" id="canvas">
          <div class="hint-toast" id="hint-toast"></div>
          <div class="reveal-banner" id="reveal-banner">
            <div>
              <div class="reveal-title" id="reveal-banner">
                <div>
                  <div class="reveal-title" id="reveal-title"></div>
                  <div class="reveal-def" id="reveal-def"></div>
                </div>
                <button class="btn-next" id="btn-reveal-action" onclick="revealAction()">Back to levels →</button>
              </div>
            </div>
            <div class="bottom-bar">
              <div class="progress-pips" id="progress-pips"></div>
              <span class="attempt-count" id="attempt-count"></span>
            </div>
          </div>
        </div>

        <script>
        /* SCRIPT */
          const CANVAS_W = 780, CANVAS_H = 500;
          let currentLevel = null;
          let hintUsed = false, hintTimer = null;
          let attempt = 0;

          // Speedrun state
          const SPEEDRUN_ORDER = ['proximity', 'similarity', 'continuity', 'closure', 'figureground', 'symmetry'];
          const SPEEDRUN_NAMES = ['Proximity', 'Similarity', 'Continuity', 'Closure', 'Figure/Ground', 'Symmetry'];
          let isSpeedrun = false;
          let srLevelIndex = 0;
          let srLevelStart = 0;
          let srRunStart = 0;
          let srLevelTimes = [];
          let srTimerInterval = null;

          function switchMode(mode){
            document.getElementById('btn-mode-levels').classList.toggle('active', mode === 'levels');
            document.getElementById('btn-mode-speedrun').classList.toggle('active', mode === 'speedrun');
            document.getElementById('btn-mode-levels').classList.toggle('active', mode === 'levels');
            document.getElementById('btn-mode-speedrun').classList.toggle('active', mode === 'speedrun');
          }

          function showScreen(id){
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
          }

          function goToIntro(){
            srStop();
            isSpeedrun = false;
            showScreen('intro');
          }

          /* Speedrun helpers */
          function srStop(){
            clearInterval(srTimerInterval);
            srTimerInterval = null;
          }

          function srFormatTime(ms){
            const totalSec = Math.floor(ms/1000);
            const m = Math.foor(totalSec/60);
            const s = totalSec % 60;
            return m > 0 ? '${m}m ${s}s' : '${s}s';
          }

          function srFormatClock(ms){
            const totalSec = Math.floor(ms/1000);
            const m = Math.foor(totalSec/60);
            const s = totalSec % 60;
            return '${m}:${s.toString().padStart(2,'0')}';
          }

          function srTickTimer(){
            const elapsed = Date.now() - srRunStart;
            document.getElementById('speedrun-timer').textContent = srFormatClock(elapsed);
          }

          function startSpeedrun(){
            isSpeedrun = true;
            srLevelIndex = 0;
            srLevelTimes = [];
            srRunStart = Date.now();
            srLevelStart = Date.now();
            showScreen('game');
            srStop();
            srTimerInterval = setInterval(srTickTimer, 500);
            srLoadCurrentLevel();
          }

          function srLoadCurrentLevel(){
            const level = SPEEDRUN_ORDER[srLevelIndex];
            srLevelStart = Date.now();
            currentLevel = level;
            attempts = 0;
            hintUsed = false;
            document.getElementById('reveal-banner').classList.remove('show');
            document.getElementById('attempt-count').textContent = '';
            document.getElementById('btn-hint').style.display = 'none';
            document.getElementById('speedrun-timer').classList.add('visible');
            const btn = document.getElementById('btn-reveal-action');
            btn.textContent = srLevelIndex < SPEEDRUN_ORDER.length - 1 ? 'Next Level →' : 'See Results →';
            if (level === 'proximity') initProximity();
            else if (level === 'similarity') initSimilarity();
             else if (level === 'continuity') initContinuity();
             else if (level === 'closure') initClosure();
             else if (level === 'figureground') initFigureGround();
             else if (level === 'symmetry') initSymmetry();
          }

          function srLevelComplete(){
            srLevelTimes.push(Date.now() - srLevelStart);
          }

          function revealAction(){
            if (!isSpeedrun){
              goToIntro();
              return;
            }
            srLevelIndex++;
            if (srLevelIndex >= SPEEDRUN_ORDER.length){
              srStop();
              showSummary();
            }
            else{
              srLoadCurrentLevel();
            }
          }

          function showSummary(){
            spawnConfetti;
            const totalMs = srLevelTimes.reduce((a,b) => a + b, 0);
            document.getElementById('summary-total').textContent = srFormatTime(totalMs);
            const tbody = document.getElementById('summary-table');
            tbody.innerHTML = srLevelTimes.map((ms, i) => '<tr><td>Level ${i+1} - ${SPEEDRUN_NAMES[i]}</td><td>${srFormatTime(ms)}</td></tr>').join('');
            showScreen('summary');
          }
