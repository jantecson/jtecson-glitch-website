<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Instinct</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --black: #000;
        --white: #fff;
        --gray-100: #f5f5f5;
        --gray-200: #e5e5e5;
        --gray-400: #a0a0a0;
        --gray-600: #666;
        --accent: #d60000;
        --green: #2e9e6e;
        --green-soft: #eaf7f2;
      }

      html, body {
        height: 100%; font-family: 'Inter', sans-serif;
        background: var(--white); color: var(--black); overflow-x: hidden;
      }

      /* SCREENS */
      .screen { display: none; min-height: 100vh; }
      .screen.active { display: flex; }

      /* INTRO */
      #intro {
        flex-direction: column; align-items: center;
        justify-content: center; padding: 48px 24px;
        text-align: center; position: relative; overflow: hidden;
      }

      #intro::before {
        content: ''; position: absolute;
        width: 600px; height: 600px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        top: -200px; right: -200px;
        animation: slowSpin 30s linear infinite; 
      }

      #intro::after {
        content: ''; position: absolute;
        width: 400px; height: 400px; border-radius: 50%;
        border: 1px solid var(--gray-200);
        bottom: -150px; left: -100px;
        animation: slowSpin 20s linear infinite reverse; 
      }

      @keyframe slowSpin {
        from { transform: rotate(0deg); } to { transform: rotate(360deg); }
      }

      .eyebrow {
        font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
        text-transform: uppercase; color: var(--accent);
        margin-bottom: 20px; position: relative; z-index: 1;
      }

      .intro-title{
        font-size: clamp(52px, 9vw, 100px); font-weight: 900;
        line-height: 0.92; letter-spacing: -0.04em;
        margin-bottom: 24px; position: relative; z-index: 1;
      }

      .intro-title .u { border-bottom: 4px solid var(--accent); }

      intro-sub{
        font-size: 17px; font-weight: 300; color: var(--gray-600);
        max-width: 400px; line-height: 1.65
      }

      .intro-buttons{
        display: flex; gap: 12px; flex-wrap: wrap;
        justify-content: center; position: relative; z-index: 1;
      }

      .btn-start{
        background: var(--black); color: var(--white); border: none;
        padding: 18px 44px; font-size: 14px; font-weight: 700;
        letter-spacing: 0.07em; text-transform: uppercase;
        cursor: pointer; border-radius: 2px;
        transition: background 0.15s, transform 0.15s;
      }

      .btn-start:hover {background: var(--accent); transform: translateY(-2px); }

      .btn-start.secondary {
        background: none; color: var(--black);
        border: 2px solid var(--gray-200);
      }

      .btn-start.secondary:hover {
        background:none; border-color: var(--black);
        transform: translateY(-2px);
      }

      .intro-note{
        margin-top: 20px; font-size: 12px; color: var (--gray-400);
        font-style: italic; position: relative; z-index: 1;
      }

      /* GAME SHELL */
      #game { flex-direction: column; }

      .game-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 20px 40px; border-bottom: 1px solid var (--gray-200); flex-shrink: 0;
      }

      .game-logo {font-size: 14px; font-weight: 900; letter-spacing: -0.02em; }

      .header-tag {
        font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
        text-transform: uppercase; color: var(--accent);
      }

      .header-right {display: flex; gap: 12px; align-items: center; }

      .btn-sm {
        background: none; border: 1px solid var(--gray-200);
        color: var(--gray-600); padding: 8px 16px;
        font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
        text-transform: uppercase; cursor: pointer; border-radius: 2px;
        transition: border-color 0.15s, color 0.15s;
      }
      .btn-sm:hover {border-color: var(--black); color: var(--black);}
      .btn-sm.hint-btn:hover { border-color: var(--accent); color: var(--accent); }
      .btn-sm:disabled { opacity: 0.3; pointer-events: none; }

      .game-body {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; padding: 32px 24px 24px;
      }

      .prompt {
        font-size: 12px; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--gray-400); margin-bottom: 16px;
      }

      .canvas-wrap {
        position: relative; width: 100%; max-width: 780px; height: 500px;
        background: var(--gray-100); border: 1px solid var(--gray-200);
        border-radius: 4px; overflow: hidden;
      }

      .bottom-bar{
        display: flex; align-items: center; gap: 16px;
        margin-top: 16px; height: 32px;
      }

      .attempt-count{ font-size: 12px; font-weight: 500; color: var(--gray-400); }
      .progress-pips{ display: flex; gap: 6px; align-items: center; }
      .pip{
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--gray-200); transform: background 0.3s;
      }
      .pip.done {background: var(--green);}

      /* SHAPES */
      .shape {
        position: absolute; cursor: grab; user-select: none;
        transition: filter 0.15s;
      }

      .shape:hover {filter: brigtness(0.8); }
      .shape.dragging {cursor: grabbing; filter: brightness(0.6); z-index: 1000; }
      .shape svg { display: block; }
      
      @keyframes idleFloat {
        0%, 100% {translate: 0 0; } 50% {translate: 0 -5px}
      }

      .idle { animation: idleFloat ease-in-out infinite; }

      @keyframes snapIn {
        from {transform: scale(0.7); opacity: 0.4; }
        to {transform: scale(1); opacity: 1; }
      }

      .snap {animation: snapIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1); }

      @keyframes wrongShake {
        0%, 100% { translate: 0 0; }
        20% { translate: -7px 0;} 40% { translate: 7px 0;}
        60% {translate: -4px 0;} 80% { translate: 4px 0;}
      }
